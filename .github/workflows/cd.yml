name: CD

# Dispara ao criar uma tag de versão semântica, ex.: v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: denuncias
          POSTGRES_PASSWORD: denuncias
          POSTGRES_DB: denuncias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denuncias -d denuncias"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://denuncias:denuncias@localhost:5432/denuncias
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        run: pytest

  build-push:
    name: Build e publicação da imagem
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir versão e nome da imagem
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Credencial vem do Secrets Management do GitHub (token automático, nada no código)
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release no GitHub
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Criar release com notas automáticas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"

  deploy-homologacao:
    name: Deploy em homologação (simulado)
    needs: build-push
    runs-on: ubuntu-latest
    # Ambiente "homologacao": permite variáveis/segredos próprios e, se quiser,
    # aprovação manual (Settings > Environments > Required reviewers)
    environment: homologacao
    permissions:
      contents: read
      packages: read
    env:
      APP_TAG: ${{ needs.build-push.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir a versão publicada (pull da imagem do registry)
        run: |
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          export GHCR_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # Senha do PostgreSQL gerada a cada deploy: nada de credencial fixa no repositório
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
          export POSTGRES_PASSWORD
          docker compose pull app
          docker compose up -d --no-build

      - name: Smoke test
        run: |
          esperar_saude() {
            for i in $(seq 1 30); do
              curl -fsS http://localhost:8000/health -o health.json && return 0
              sleep 2
            done
            return 1
          }

          esperar_saude
          cat health.json
          jq -e --arg v "$APP_TAG" '.status == "ok" and .version == $v' health.json

          # Grava uma denúncia pela API
          PROTOCOLO=$(curl -fsS -X POST http://localhost:8000/denunciar \
            -F data_ocorrido=2026-01-01 \
            -F local_ocorrido="smoke test" \
            -F descricao_ocorrido="smoke test" \
            -F descricao_individuo="smoke test" | jq -r .protocolo)
          echo "Protocolo: $PROTOCOLO"

          # Confere que a linha existe de fato no PostgreSQL
          docker compose exec -T db psql -U denuncias -d denuncias -tAc \
            "SELECT count(*) FROM denuncias WHERE protocolo = '$PROTOCOLO'" | grep -qx 1

          # Reinicia a aplicação e confere que o dado sobreviveu (persistência real)
          docker compose restart app
          esperar_saude
          docker compose exec -T db psql -U denuncias -d denuncias -tAc \
            "SELECT count(*) FROM denuncias WHERE protocolo = '$PROTOCOLO'" | grep -qx 1

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs app db

      - name: Resumo do deploy
        if: success()
        run: |
          echo "### Deploy em homologação (simulado)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versão: \`$APP_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagem: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sistema-denuncias:$APP_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Banco: PostgreSQL (denúncia gravada e mantida após reinício da aplicação)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke test: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: Derrubar ambiente simulado
        if: always()
        run: docker compose down -v
