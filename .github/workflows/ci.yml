name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # PostgreSQL descartável só para os testes de persistência
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: denuncias
          POSTGRES_PASSWORD: denuncias
          POSTGRES_DB: denuncias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denuncias -d denuncias"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://denuncias:denuncias@localhost:5432/denuncias

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Rodar lint (flake8)
        run: |
          flake8 .

      - name: Rodar testes (pytest)
        run: |
          pytest
