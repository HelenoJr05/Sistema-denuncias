[pytest]
markers =
    integration: testes de integração real (requerem conexão com internet)
    postgres: testes contra PostgreSQL real (rodam só se TEST_DATABASE_URL estiver definida)
asyncio_mode = auto
# Por padrão não roda os testes que dependem de internet (ViaCEP real).
# Para rodar só os de integração: pytest -m integration
addopts = -m "not integration"
